      - label: IT Support
        details: Windows, Ivanti, imaging, troubleshooting, ticketing, hardware, printers
      - label: Networking
        details: Cisco Meraki, TCP/IP, Ethernet, Wi-Fi, DNS, DHCP, VPN/WireGuard
      - label: Infrastructure
        details: Linux, Windows Server, VMware ESXi/vSphere, Proxmox VE, Unraid, Docker, virtual machines
      - label: Tools & Storage
        details: PowerShell, Bash, Git, SMB shares, backup and recovery

        start_date: 2017-02
        end_date: 2018-05
        location: Elgin, IL
        highlights:
          - Troubleshot student PCs, replaced hardware, and helped IT staff image, configure, and deploy workstations
      - company: Pauly Toyota
        position: Assistant Service Manager
        start_date: 2014-08
        end_date: 2017-02
        location: Crystal Lake, IL

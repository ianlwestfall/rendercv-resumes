          - Supported enterprise virtual machines, documented server configurations and access controls for a remote team
          - Clarified access requirements and updated team documentation to guide future virtual machine requests
      - company: Elgin Community College
        position: Computer Lab Assistant
        date:
        start_date: 2017-02
        end_date: 2018-05
        location: Elgin, IL
        summary:
        highlights:
          - Assisted students with technical issues and helped IT staff set up, image, and deploy workstations
      - company: Pauly Toyota
        position: Assistant Service Manager
        date:
        start_date: 2014-08
        end_date: 2017-02
        location: Crystal Lake, IL
        summary:
        highlights:
          - Supervised five technicians, coordinating repairs to meet deadlines, maintain productivity, and control costs
          - Tracked repair orders, billing, and warranty claims; communicated recommendations and timelines to customers
          - Created a quick-reference guide adopted by all service writers, simplifying access to contacts and procedures
    skills:
      - label: Operations & Administration
        details: Work order processing, recordkeeping, scheduling, warranty claims
      - label: Customer Service
        details: Customer communication, issue resolution, phone support, explaining technical information
      - label: Organization & Leadership
        details: Team supervision, prioritization, documentation, process improvement

      - company: Community Unit School District 300
        position: Technology Coordinator
        date:
        start_date: 2021-06
        end_date: 2022-10
        location: Hampshire, IL
        summary:
        highlights:
          - Ranked first in resolved incidents, 19% ahead of second place and 55% above team average
          - Supported staff and students across 7+ schools through in-person, remote, and phone assistance
          - Independently prioritized requests, documented resolutions, and minimized disruption to school operations
